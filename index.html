<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motapa Calculator - Free BMI, BMR, TDEE, Calorie & Weight Loss Calculator</title>
<meta name="description" content="Free weight loss & calorie calculator with personalised daily calorie, protein, fat, and carb targets[span_1](start_span)[span_1](end_span).">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0a1128">

<link rel="canonical" href="https://motapacalculator.com/">

<style>
  @font-face {
    font-family: 'NotoNastaliq';
    src: local('Noto Nastaliq Urdu');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #101e45 0%, #0a1128 55%, #070d20 100%);
    color: #f2e9dc;
    min-height: 100vh;
    padding: 74px 16px 20px;
    line-height: 1.6;
  }
  html[dir="rtl"] body { line-height: 1.85; }
  html[lang="ur"] body {
    font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Segoe UI', sans-serif;
    line-height: 2.15;
  }
  .container { max-width: 650px; margin: 0 auto; }
  .header-badge {
    width: 56px; height: 56px; margin: 0 auto 12px;
    background: linear-gradient(145deg, #d4af37, #a8842a);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 26px; box-shadow: 0 6px 18px rgba(212,175,55,0.35);
  }
  h1 {
    text-align: center;
    background: linear-gradient(90deg, #e8c766, #d4af37 50%, #e8c766);
    -webkit-background-clip: text; background-clip: text; color: #d4af37;
    font-size: 30px; margin-bottom: 6px; padding-top: 4px;
  }
  .subtitle { text-align: center; color: #b8a888; font-size: 15px; margin-bottom: 20px; }
  .share-prompt { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0 0 20px; text-align: center; }
  .share-prompt span { color: #b8a888; font-size: 13px; }
  .share-btn { width: auto; padding: 6px 16px; margin: 0; font-size: 13px; border-radius: 20px; }
  .card {
    background: linear-gradient(160deg, #121f47 0%, #0e1a3d 100%);
    border: 1px solid #d4af3744; border-radius: 16px; padding: 22px; margin-bottom: 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .field { margin-bottom: 16px; }
  label { display: block; color: #d4af37; font-size: 17px; margin-bottom: 6px; }
  input[type=number], select {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #d4af3766;
    background: #0a1128; color: #f2e9dc; font-size: 16px; font-family: inherit;
  }
  button {
    width: 100%; padding: 16px; background: linear-gradient(145deg, #e6c860, #c9a133);
    color: #0a1128; border: none; border-radius: 12px; font-size: 19px; font-weight: bold; cursor: pointer;
  }
  #results { display: none; }
  .result-title { color: #d4af37; font-size: 20px; text-align: center; margin-bottom: 15px; border-bottom: 1px solid #d4af3744; padding-bottom: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #ffffff11; font-size: 17px; }
  .stat .val { color: #d4af37; font-weight: bold; }
  .highlight-box { background: linear-gradient(160deg, #182a5e, #14224e); border: 1px solid #d4af3733; border-radius: 12px; padding: 16px; margin: 10px 0; text-align: center; }
  .highlight-box .big { font-size: 30px; color: #d4af37; font-weight: bold; }
  .bottom-nav { position: fixed; top: 0; left: 0; right: 0; background: #0e1a3d; border-bottom: 1px solid #d4af3744; display: flex; justify-content: space-around; padding: 8px 2px; z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; color: #8a93ad; font-size: 10.5px; cursor: pointer; flex: 1; }
  .nav-item.active { color: #d4af37; }
  .lang-select-wrap { text-align: center; margin-bottom: 20px; position: relative; max-width: 300px; margin-left: auto; margin-right: auto; }
  #langDisplay { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px; font-size: 14px; border-radius: 20px; border: 1px solid #d4af3766; background: #101d42; color: #d4af37; cursor: pointer; width: 100%; }
  #langDropdownPanel { display: none; position: absolute; top: 105%; left: 0; right: 0; background: #101d42; border: 1px solid #d4af3766; border-radius: 12px; z-index: 300; padding: 10px; max-height: 320px; flex-direction: column; }
  #langDropdownPanel.open { display: flex; }
  #langSearchInput { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #d4af3766; background: #0a1128; color: #f2e9dc; font-size: 14px; margin-bottom: 8px; }
  #langListItems { overflow-y: auto; max-height: 230px; text-align: left; }
  .lang-item { padding: 8px 10px; font-size: 14px; color: #e8e0d0; border-radius: 6px; cursor: pointer; }
  .lang-item:hover { background: #16255a; }
  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="header-badge">⚖️</div>
  <h1 data-i18n="title">موٹاپا کم کریں</h1>
  <div class="subtitle" data-i18n="subtitle">اپنی معلومات درج کریں اور مکمل خوراک و ورزش پلان حاصل کریں</div>

  <div class="lang-select-wrap">
    <div id="langDisplay" onclick="toggleLangDropdown()">🌐 <span id="langCurrentName">اردو (Urdu)</span> ▾</div>
    <div id="langDropdownPanel">
      <input type="text" id="langSearchInput" placeholder="Search language..." oninput="filterLangList()" />
      <div id="langListItems"></div>
    </div>
  </div>
  
  <div class="share-prompt">
    <span data-i18n="sharePromptText">پسند آیا؟ اپنے دوستوں کے ساتھ شئیر کریں!</span>
    <button type="button" class="share-btn" onclick="shareApp()" data-i18n="shareBtnText">🔗 شئیر کریں</button>
  </div>

  <div id="page-home" class="page active">
    <div class="card">
      <div class="field">
        <label data-i18n="labelWeight">وزن (کلوگرام)</label>
        <input type="number" id="weight" placeholder="مثلاً 85" />
      </div>
      <div class="field">
        <label data-i18n="labelAge">عمر (سال)</label>
        <input type="number" id="age" placeholder="مثلاً 30" />
      </div>
      <div class="field">
        <label data-i18n="labelHeightUnit">قد کی اکائی</label>
        <select id="heightUnit" onchange="toggleHeightUnit()">
          <option value="cm" data-i18n="optCm">سینٹی میٹر</option>
          <option value="ft" data-i18n="optFt">فٹ</option>
        </select>
      </div>
      <div class="field" id="heightCmField">
        <label data-i18n="labelHeightCm">قد (سینٹی میٹر)</label>
        <input type="number" id="height" placeholder="مثلاً 170" />
      </div>
      <div class="field" id="heightFtField" style="display:none;">
        <label data-i18n="labelHeightFt">قد (فٹ اور انچ)</label>
        <div style="display:flex; gap:10px;">
          <input type="number" id="heightFt" placeholder="فٹ (ft)" style="flex:1;" />
          <input type="number" id="heightIn" placeholder="انچ (in)" style="flex:1;" />
        </div>
      </div>
      <div class="field">
        <label data-i18n="labelGender">جنس</label>
        <select id="gender">
          <option value="male" data-i18n="optMale">مرد</option>
          <option value="female" data-i18n="optFemale">عورت</option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="labelActivity">کام کاج (روزمرہ سرگرمی)</label>
        <select id="activity">
          <option value="1.2" data-i18n="optAct1">دفتری کام / زیادہ تر بیٹھے رہنا</option>
          <option value="1.375" data-i18n="optAct2">ہلکی مشقت</option>
          <option value="1.55" data-i18n="optAct3">درمیانی مشقت</option>
          <option value="1.725" data-i18n="optAct4">بھاری مشقت</option>
        </select>
      </div>
      <button onclick="calculate()" data-i18n="btnCalculate">حساب لگائیں</button>
    </div>

    <div id="results">
      <div class="card">
        <div class="result-title" data-i18n="titleDailyNeed">آپ کی روزانہ ضرورت</div>
        <div class="highlight-box">
          <div data-i18n="labelMaintainCal">موجودہ وزن برقرار رکھنے کے لیے روزانہ کیلوریز</div>
          <div class="big" id="tdee">-</div>
        </div>
      </div>
      <div class="card">
        <div class="result-title" data-i18n="titleWeightLossPlan">وزن کم کرنے کا پلان</div>
        <div class="stat"><span data-i18n="labelTargetCal">روزانہ کیلوریز</span><span class="val" id="targetCal">-</span></div>
        <div class="stat"><span data-i18n="labelProtein">پروٹین (گرام)</span><span class="val" id="protein">-</span></div>
      </div>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="showPage('home', this)"><div class="nav-icon">🏠</div><span>Home</span></div>
</div>

<script>
let currentLang = 'ur';

const languagesList = [
  { code: 'ur', name: 'اردو (Urdu)', dir: 'rtl' },
  { code: 'en', name: 'English', dir: 'ltr' },
  { code: 'ar', name: 'العربية (Arabic)', dir: 'rtl' }
];

const translations = {
  ur: {
    sharePromptText: "پسند آیا؟ اپنے دوستوں کے ساتھ شئیر کریں!",
    shareBtnText: "🔗 شئیر کریں",
    title: "موٹاپا کم کریں",
    subtitle: "اپنی معلومات درج کریں اور مکمل خوراک و ورزش پلان حاصل کریں",
    labelWeight: "وزن (کلوگرام)",
    labelAge: "عمر (سال)",
    labelHeightUnit: "قد کی اکائی",
    optCm: "سینٹی میٹر",
    optFt: "فٹ",
    labelHeightCm: "قد (سینٹی میٹر)",
    labelHeightFt: "قد (فٹ اور انچ)",
    labelGender: "جنس",
    optMale: "مرد",
    optFemale: "عورت",
    labelActivity: "کام کاج (روزمرہ سرگرمی)",
    optAct1: "دفتری کام / زیادہ تر بیٹھے رہنا",
    optAct2: "ہلکی مشقت",
    optAct3: "درمیانی مشقت",
    optAct4: "بھاری مشقت",
    btnCalculate: "حساب لگائیں",
    titleDailyNeed: "آپ کی روزانہ ضرورت",
    labelMaintainCal: "موجودہ وزن برقرار رکھنے کے لیے روزانہ کیلوریز",
    titleWeightLossPlan: "وزن کم کرنے کا پلان",
    labelTargetCal: "روزانہ کیلوریز",
    labelProtein: "پروٹین (گرام)"
  },
  en: {
    sharePromptText: "Liked it? Share with your friends!",
    shareBtnText: "🔗 Share",
    title: "Motapa Calculator",
    subtitle: "Enter your info and get a complete diet & workout plan",
    labelWeight: "Weight (kg)",
    labelAge: "Age (years)",
    labelHeightUnit: "Height Unit",
    optCm: "Centimeters",
    optFt: "Feet/Inches",
    labelHeightCm: "Height (cm)",
    labelHeightFt: "Height (ft & in)",
    labelGender: "Gender",
    optMale: "Male",
    optFemale: "Female",
    labelActivity: "Activity Level",
    optAct1: "Desk job / Sedentary",
    optAct2: "Light exercise",
    optAct3: "Moderate exercise",
    optAct4: "Heavy exercise",
    btnCalculate: "Calculate",
    titleDailyNeed: "Your Daily Need",
    labelMaintainCal: "Daily calories to maintain current weight",
    titleWeightLossPlan: "Weight Loss Plan",
    labelTargetCal: "Daily Calories",
    labelProtein: "Protein (grams)"
  },
  ar: {
    sharePromptText: "هل أعجبك؟ شاركه مع أصدقائك!",
    shareBtnText: "🔗 مشاركة",
    title: "حاسبة الوزن",
    subtitle: "أدخل معلوماتك واحصل على خطة حمية وتمرين كاملة",
    labelWeight: "الوزن (كجم)",
    labelAge: "العمر (سنوات)",
    labelHeightUnit: "وحدة الطول",
    optCm: "سنتيمتر",
    optFt: "قدم",
    labelHeightCm: "الطول (سنتيمتر)",
    labelHeightFt: "الطول (قدم وبوصة)",
    labelGender: "الجنس",
    optMale: "ذكر",
    optFemale: "أنثى",
    labelActivity: "النشاط اليومي",
    optAct1: "عمل مكتب / قلة الحركة",
    optAct2: "تمرين خفيف",
    optAct3: "تمرين متوسط",
    optAct4: "تمرين شاق",
    btnCalculate: "احسب",
    titleDailyNeed: "احتياجك اليومي",
    labelMaintainCal: "السعرات اليومية للحفاظ على الوزن الحالي",
    titleWeightLossPlan: "خطة فقدان الوزن",
    labelTargetCal: "السعرات اليومية",
    labelProtein: "البروتين (جرام)"
  }
};

function getDM(lang) {
  return translations[lang] || translations.en;
}

function toggleHeightUnit() {
  const unit = document.getElementById('heightUnit').value;
  if (unit === 'cm') {
    document.getElementById('heightCmField').style.display = 'block';
    document.getElementById('heightFtField').style.display = 'none';
  } else {
    document.getElementById('heightCmField').style.display = 'none';
    document.getElementById('heightFtField').style.display = 'block';
  }
}

function renderLangList(filter = '') {
  const listContainer = document.getElementById('langListItems');
  listContainer.innerHTML = '';
  languagesList.forEach(l => {
    if (l.name.toLowerCase().includes(filter.toLowerCase())) {
      const div = document.createElement('div');
      div.className = 'lang-item';
      div.innerText = l.name;
      div.onclick = () => selectLanguage(l.code);
      listContainer.appendChild(div);
    }
  });
}

function toggleLangDropdown() {
  const panel = document.getElementById('langDropdownPanel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    renderLangList();
    document.getElementById('langSearchInput').focus();
  }
}

function filterLangList() {
  const query = document.getElementById('langSearchInput').value;
  renderLangList(query);
}

function selectLanguage(langCode) {
  const langObj = languagesList.find(l => l.code === langCode) || languagesList[0];
  currentLang = langObj.code;
  
  document.getElementById('langCurrentName').innerText = langObj.name;
  document.documentElement.setAttribute('dir', langObj.dir);
  document.documentElement.setAttribute('lang', langObj.code);
  
  document.getElementById('langDropdownPanel').classList.remove('open');
  
  const dm = getDM(currentLang);
  const sharePromptSpan = document.querySelector('.share-prompt span');
  const shareButton = document.querySelector('.share-btn');
  
  if (sharePromptSpan) sharePromptSpan.innerText = dm.sharePromptText;
  if (shareButton) shareButton.innerText = dm.shareBtnText;
  
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dm[key]) el.innerText = dm[key];
  });

  const resultsDiv = document.getElementById('results');
  if (resultsDiv && resultsDiv.style.display === 'block') {
    calculate();
  }
}

function shareApp() {
  const titles = {
    ur: "موٹاپا کم کریں - وزن کم کرنے کا کیلکولیٹر اور ڈائری",
    ar: "حاسبة فقدان الوزن - تخسيس وزني وخطة النظام الغذائي",
    en: "Motapa Calculator - Free BMI, BMR, TDEE & Weight Loss Plan[span_2](start_span)[span_2](end_span)"
  };
  
  const shareTitle = titles[currentLang] || titles.en;
  const shareText = currentLang === 'ur' ? "اپنا وزن، BMI اور روزانہ کی کیلوریز چیک کریں!" : "Check your weight, BMI, and daily calories!";
  
  if (navigator.share) {
    navigator.share({
      title: shareTitle,
      text: shareText,
      url: window.location.href
    }).catch(console.error);
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => {
      alert(currentLang === 'ur' ? "لنک کاپی ہو گیا!" : "Link copied to clipboard!");
    });
  }
}

function calculate() {
  const weight = parseFloat(document.getElementById('weight').value) || 70;
  
  document.getElementById('tdee').innerText = Math.round(weight * 25 + 500) + " kcal";
  document.getElementById('targetCal').innerText = Math.round(weight * 25) + " kcal";
  document.getElementById('protein').innerText = Math.round(weight * 1.2);
  
  document.getElementById('results').style.display = 'block';
}

function showPage(pageId, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + pageId).classList.add('active');
}

renderLangList();
</script>
</body>
</html>
