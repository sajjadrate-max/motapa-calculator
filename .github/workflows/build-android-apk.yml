name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "APK at: $APK_PATH"
          ls -la "$APK_PATH"
          cp "$APK_PATH" motapa-calculator.apk
          echo "path=motapa-calculator.apk" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: motapa-calculator-apk
          path: motapa-calculator.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
          gh release create "$TAG" motapa-calculator.apk \
            --repo "${{ github.repository }}" \
            --title "Motapa Calculator - Android App" \
            --notes "Android app (APK) build of motapacalculator.com, built automatically from the android/ project in this repo. This is a direct APK download (not published on the Play Store), so installing it requires enabling 'install from unknown sources' on your phone the first time. The app always shows the live, current website." \
            --latest
